name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag is on the checked-out commit
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"

      - name: Run tests
        run: swift test --skip InteropTests

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build universal DMG
        run: Scripts/build_release.sh dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Chainy-*.dmg \
            dist/Chainy-*.dmg.sha256 \
            --title "Chainy $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
