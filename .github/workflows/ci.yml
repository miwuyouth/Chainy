name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run package tests
        # InteropTests contains the release-time 1...5-hop exhaustive
        # protocol matrix and requires a local xray-core fixture. Keep the
        # ordinary PR check fast and deterministic.
        run: swift test --skip InteropTests
